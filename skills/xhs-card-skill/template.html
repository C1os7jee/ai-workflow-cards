<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        --ink: #111820;
        --muted: #61707d;
        --line: #d7dfe7;
        --paper: #fbfcfd;
        --blue: #0759b8;
        --lemon: #f8d84a;
        --forest: #14745a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1440px;
        margin: 0;
        overflow: hidden;
        background: #eff3f7;
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        letter-spacing: 0;
      }

      body {
        display: block;
      }

      .card {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 82px 78px;
        background:
          linear-gradient(90deg, rgba(8, 31, 52, 0.045) 1px, transparent 1px),
          linear-gradient(rgba(8, 31, 52, 0.045) 1px, transparent 1px),
          var(--paper);
        background-size: 44px 44px;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 34px;
        border: 2px solid var(--line);
        border-radius: 28px;
        pointer-events: none;
      }

      .theme-band {
        position: absolute;
        left: 78px;
        right: 78px;
        top: 78px;
        height: 12px;
        border-radius: 999px;
        background: var(--accent);
      }

      .meta {
        margin-top: 48px;
        color: var(--accent);
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0;
      }

      h1 {
        margin: 230px 0 34px;
        font-size: 98px;
        line-height: 1.02;
        letter-spacing: 0;
      }

      h2 {
        margin: 172px 0 42px;
        font-size: 78px;
        line-height: 1.08;
        letter-spacing: 0;
      }

      .hook {
        max-width: 820px;
        color: #27313b;
        font-size: 46px;
        line-height: 1.35;
        font-weight: 600;
      }

      .points {
        display: grid;
        gap: 24px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .points li {
        border: 2px solid var(--line);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.76);
        padding: 30px 34px;
        font-size: 44px;
        line-height: 1.28;
        font-weight: 650;
      }

      .cta {
        display: grid;
        place-items: center;
        height: 100%;
        text-align: center;
      }

      .cta h2 {
        margin: 0;
        max-width: 820px;
        font-size: 86px;
      }

      .footer {
        position: absolute;
        left: 78px;
        right: 78px;
        bottom: 62px;
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 24px;
      }

      .cover h1 {
        margin-top: 248px;
      }

      .cover .hook {
        margin-top: 34px;
      }

      .cover.has-generated-image h1 {
        margin-top: 36px;
        font-size: 76px;
      }

      .generated-image {
        width: 100%;
        height: 670px;
        margin-top: 54px;
        border: 2px solid var(--line);
        border-radius: 28px;
        object-fit: cover;
        display: block;
        background: #dde5ed;
      }

      .content .points {
        margin-top: 64px;
      }

      .swiss h1,
      .swiss h2 {
        font-weight: 850;
      }

      .editorial h1,
      .editorial h2 {
        font-weight: 760;
      }
    </style>
  </head>
  <body>
    <div id="card"></div>
    <script>
      const deck = __DECK_JSON__;
      const slideIndex = Number("__SLIDE_INDEX__");
      const slide = deck.slides[slideIndex];
      const themes = {
        IKB: "#0759b8",
        lemon: "#e0ba1f",
        forest: "#14745a"
      };
      const accent = themes[deck.theme] || themes.IKB;
      document.documentElement.style.setProperty("--accent", accent);

      const root = document.querySelector("#card");
      const card = document.createElement("main");
      card.className = `card ${deck.style} ${slide.type}`;
      if (slide.type === "cover" && deck.generated_cover_image) {
        card.className += " has-generated-image";
      }
      card.innerHTML = `<div class="theme-band"></div>`;

      if (slide.type === "cover") {
        card.innerHTML += `
          <div class="meta">${deck.layout_id} / ${deck.theme}</div>
          ${deck.generated_cover_image ? `<img class="generated-image" src="${escapeAttribute(deck.generated_cover_image)}" alt="">` : ""}
          <h1>${escapeHtml(slide.title)}</h1>
          <p class="hook">${escapeHtml(slide.hook)}</p>
        `;
      } else if (slide.type === "content") {
        card.innerHTML += `
          <div class="meta">0${slideIndex + 1} / ${deck.style}</div>
          <h2>${escapeHtml(slide.heading)}</h2>
          <ul class="points">
            ${slide.points.map(point => `<li>${escapeHtml(point)}</li>`).join("")}
          </ul>
        `;
      } else {
        card.innerHTML += `
          <div class="cta">
            <h2>${escapeHtml(slide.text)}</h2>
          </div>
        `;
      }

      card.innerHTML += `<div class="footer"><span>AI 工作流日志</span><span>Visual Agent</span></div>`;
      root.append(card);

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function escapeAttribute(value) {
        return escapeHtml(value).replaceAll("`", "&#096;");
      }
    </script>
  </body>
</html>
